name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        run: |
          unzip -q -o AssistenteVozjarvis-apk.zip
          FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle.kts NAO ENCONTRADO. Arquivos no repositorio:"
            find . -not -path './.git/*' -type f | head -50
            exit 1
          fi
          echo "Projeto em: $(dirname "$FILE")"
          cd "$(dirname "$FILE")"
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AssistenteVoz-apk
          path: '**/build/outputs/apk/debug/app-debug.apk'
